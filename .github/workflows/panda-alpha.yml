name: Panda Alpha harness
on:
  push:
    paths: ['panda_alpha/**', 'tests/**', 'scripts/**', 'requirements-panda-alpha.txt', 'config/**', 'docs/**', 'examples/**', 'research_bootstrap/**', 'README*.md', 'RESEARCH.md', '.gitignore', '.github/workflows/panda-alpha.yml']
  pull_request:
    paths: ['panda_alpha/**', 'tests/**', 'scripts/**', 'requirements-panda-alpha.txt', 'config/**', 'docs/**', 'examples/**', 'research_bootstrap/**', 'README*.md', 'RESEARCH.md', '.gitignore', '.github/workflows/panda-alpha.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-panda-alpha.txt
      - run: python -B scripts/verify_public_research.py
      - run: python -m pytest tests -q
