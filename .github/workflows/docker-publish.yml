name: Build and Publish Docker Images

on:
  push:
    branches: [master, develop]
    tags: ['v*.*.*']
    paths: ['panda_alpha/**', 'quantfactra/**', 'quant_research/**', 'QUANTAXIS/**', 'config/**', 'research_bootstrap/**', 'requirements*.txt', 'README*.md', 'CONTRIBUTING.md', 'CHANGELOG.md', 'AGENTS.md', 'pyproject.toml', 'setup.py', 'MANIFEST.in', 'docker/panda-alpha/**', '.github/workflows/docker-publish.yml', 'scripts/verify_compatibility.py']
  pull_request:
    branches: [master]
    paths: ['panda_alpha/**', 'quantfactra/**', 'quant_research/**', 'QUANTAXIS/**', 'config/**', 'research_bootstrap/**', 'requirements*.txt', 'README*.md', 'CONTRIBUTING.md', 'CHANGELOG.md', 'AGENTS.md', 'pyproject.toml', 'setup.py', 'MANIFEST.in', 'docker/panda-alpha/**', '.github/workflows/docker-publish.yml', 'scripts/verify_compatibility.py']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested research image to Docker Hub'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source compatibility and documentation
        run: python scripts/verify_compatibility.py

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Select this project's image name
        id: image
        env:
          IMAGE_NAME: ${{ vars.DOCKER_IMAGE || format('{0}/quantfactra', github.repository_owner) }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the current project's research image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/panda-alpha/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: quantfactra:ci
          cache-from: type=gha,scope=panda-alpha
          cache-to: type=gha,mode=max,scope=panda-alpha
      - name: Run the installed CLI without network access
        run: |
          docker run --rm --network none quantfactra:ci --help
          docker run --rm --network none quantfactra:ci demo --output research_runs/container_demo
          docker run --rm --network none --entrypoint panda-alpha quantfactra:ci --help
          docker run --rm --network none --entrypoint python quantfactra:ci -c "from pathlib import Path; from panda_alpha.cli import get_config; cfg = get_config('/app/config/panda-alpha.example.json'); assert cfg['data']['provider'] == 'quantaxis'; assert Path(cfg['research']['memory']).is_file(); assert Path(cfg['research']['pool_snapshot']).is_file(); print('Offline configuration and bootstrap files are available')"

  publish:
    name: Publish Docker Image (manual)
    needs: [test, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish the tested revision
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/panda-alpha/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.build.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=panda-alpha
