name: Python application

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build the checked-out Fork
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel
    - name: Install the Fork in its research environment
      run: |
        python -m pip install -r requirements-panda-alpha.txt
        # The upstream trading/web/Rust stack is a separate compatibility scope.
        python -m pip install --no-deps --force-reinstall dist/*.whl
    - name: Verify the installed application outside the checkout
      working-directory: ${{ runner.temp }}
      run: |
        python - <<'PY'
        import importlib.util
        import os
        import re
        from pathlib import Path
        from importlib.metadata import distribution
        from packaging.version import Version
        import pandas as pd
        import panda_alpha
        from panda_alpha.diversity import as_factor_panel
        checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        installed = Path(panda_alpha.__file__).resolve()
        assert not installed.is_relative_to(checkout), installed
        qa = Path(importlib.util.find_spec('QUANTAXIS').origin).resolve()
        assert not qa.is_relative_to(checkout), qa
        source_version = re.search(r"__version__ = '([^']+)'", (checkout / 'QUANTAXIS/__init__.py').read_text(encoding='utf-8')).group(1)
        assert distribution('quantaxis').version == str(Version(source_version))
        assert (installed.parent / 'data.py').read_bytes() == (checkout / 'panda_alpha/data.py').read_bytes()
        panel = as_factor_panel(pd.DataFrame({'date': ['2024-01-02'], 'symbol': ['000001'], 'value': [1.0]}))
        assert panel.loc[pd.Timestamp('2024-01-02'), '000001'] == 1.0
        print('Installed Fork research application:', installed)
        PY
        panda-alpha --help
    - name: Run the research regression suite
      run: python -m pytest tests -q

